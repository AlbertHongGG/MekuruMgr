[project]
name = "comicmgr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "colorama>=0.4.6",
    "fastapi>=0.141.1",
    "filelock>=3.32.4",
    "httpx>=0.28.1",
    "pycryptodome>=3.23.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
